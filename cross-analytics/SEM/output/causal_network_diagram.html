<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEM Causal Network Diagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
        }

        .diagram-container {
            width: 100%;
            max-width: 800px;
            padding: 2.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            background: #ffffff;
            position: relative;
        }

        .node {
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            width: 160px;
            height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .node-highlight {
            border-color: #CCF381;
            background: #f9ffeb;
            color: #3b4d1a;
        }

        .node-label {
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.6;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        /* FIXED: SVG Overlay now covers the entire container from (0,0) */
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 5-Column Grid Layout */
        .layout-grid {
            display: grid;
            grid-template-columns: 160px 100px 160px 100px 160px;
            grid-template-rows: repeat(5, 54px);
            row-gap: 24px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            /* Space after header */
        }
    </style>
</head>

<body>

    <div class="diagram-container">
        <div class="text-center mb-10">
            <h1 class="text-xl font-bold text-slate-800">SEM Causal Network Diagram</h1>
            <p class="text-slate-500 text-xs mt-1 uppercase tracking-wider">Extended Theory of Planned Behavior (TPB)
                Framework</p>
        </div>

        <div class="layout-grid">
            <!-- Row 1 -->
            <div class="node"><span class="node-label">ER</span>Responsibility</div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>

            <!-- Row 2 -->
            <div class="node"><span class="node-label">EC</span>Concern</div>
            <div></div>
            <div class="node"><span class="node-label">ATB</span>Attitude</div>
            <div></div>
            <div></div>

            <!-- Row 3 -->
            <div class="node"><span class="node-label">SEK</span>Knowledge</div>
            <div></div>
            <div></div>
            <div></div>
            <div class="node node-highlight"><span class="node-label">PB</span>Participation</div>

            <!-- Row 4 -->
            <div class="node"><span class="node-label">SN</span>Social Norms</div>
            <div></div>
            <div class="node node-highlight"><span class="node-label">BI</span>Intention</div>
            <div></div>
            <div></div>

            <!-- Row 5 -->
            <div class="node"><span class="node-label">PBC</span>Perceived Control</div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>

            <!-- Corrected SVG Overlay using absolute coordinates -->
            <!-- Logic:
             Grid Content width: 680px. Grid Start X: ~60px (Center in 800 container)
             Col 1 Right: 220 | Col 3 Left: 320 | Col 3 Right: 480 | Col 5 Left: 580
             Row 1 Center Y: ~147 | R2: 225 | R3: 303 | R4: 381 | R5: 459
        -->
            <svg class="svg-overlay" viewBox="0 0 800 600">
                <defs>
                    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1" />
                    </marker>
                    <marker id="arrow-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#CCF381" />
                    </marker>
                </defs>

                <!-- ER, EC, SEK to ATB -->
                <!-- ER -> ATB -->
                <path d="M 220 147 L 270 147 L 270 225 L 315 225" stroke="#cbd5e1" stroke-width="1.5" fill="none"
                    marker-end="url(#arrow-gray)" />
                <!-- EC -> ATB -->
                <path d="M 220 225 L 315 225" stroke="#cbd5e1" stroke-width="1.5" fill="none"
                    marker-end="url(#arrow-gray)" />
                <!-- SEK -> ATB -->
                <path d="M 220 303 L 270 303 L 270 225 L 315 225" stroke="#cbd5e1" stroke-width="1.5" fill="none"
                    marker-end="url(#arrow-gray)" />

                <!-- ATB to BI (Vertical center to top) -->
                <path d="M 400 252 L 400 350" stroke="#cbd5e1" stroke-width="1.5" fill="none"
                    marker-end="url(#arrow-gray)" />

                <!-- SN to BI (HIGHLIGHTED) -->
                <path d="M 220 381 L 315 381" stroke="#CCF381" stroke-width="3" fill="none"
                    marker-end="url(#arrow-highlight)" />

                <!-- PBC to BI -->
                <path d="M 220 459 L 270 459 L 270 381 L 315 381" stroke="#cbd5e1" stroke-width="1.5" fill="none"
                    marker-end="url(#arrow-gray)" />

                <!-- BI to PB (HIGHLIGHTED) -->
                <path d="M 480 381 L 530 381 L 530 303 L 575 303" stroke="#CCF381" stroke-width="2.5" fill="none"
                    marker-end="url(#arrow-highlight)" />
            </svg>
        </div>

        <div
            class="mt-12 pt-6 border-t border-slate-100 flex justify-between items-center text-[10px] text-slate-400 uppercase tracking-widest">
            <span>Model: Extended TPB Framework</span>
            <span class="flex items-center gap-3">
                <span class="flex items-center gap-1">
                    <span class="w-3 h-3 rounded-sm bg-slate-200"></span>
                    Standard Path
                </span>
                <span class="flex items-center gap-1">
                    <span class="w-3 h-3 rounded-sm bg-[#CCF381]"></span>
                    Primary Driver (p < 0.05) </span>
                </span>
        </div>
    </div>

</body>

</html>
